name: SmartDine CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Typecheck, Lint, Tests, Build & Security Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check no .env.local or secret files committed
        run: |
          if git ls-files | grep -E '^\.env(\.local|\.production|\.development)?$'; then
            echo "ERROR: Environment secret file is tracked in Git!"
            exit 1
          fi
          echo "PASS: No .env secret files tracked in Git."

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Validate migration sequence
        run: |
          ls -1 supabase/migrations/*.sql | sort -V
          echo "PASS: Migrations listed in valid order."

      - name: Production Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder-ci.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder.ci' }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Scan client bundle for server secret names
        run: npm run verify:secrets

      - name: Run live HTTP security smoke tests
        run: npm run verify:ci-smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder-ci.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder.ci' }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
